services:
  - type: web
    name: flyest-store
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: OPENAI_API_KEY
        sync: false
